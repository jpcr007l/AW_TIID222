
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar artículo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f1f1;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 650px;
            margin: 30px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
        }

        h1 {
            color: #333;
            text-align: center;
            border-bottom: 3px solid #ddd;
            padding-bottom: 18px;
        }

        .advertencia {
            background-color: #fceaea;
            color: #b52b2b;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .identificador {
            background-color: #f1f1f1;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #f8f8f8;
            font-size: 15px;
        }

        textarea {
            resize: none;
        }

        .botones {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .cancelar {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .eliminar {
            background-color: #cc4444;
        }

        .cancelar {
            background-color: #777;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Eliminar artículo</h1>

        <div class="advertencia">
            ¿Estás seguro de que deseas eliminar este artículo?
        </div>

        <div class="identificador">
            ID del artículo: {{ articulo[0] }}
        </div>

        <form action="/eliminar/{{ articulo[0] }}" method="POST">

            <label>Nombre del producto:</label>
            <input type="text" value="{{ articulo[1] }}" readonly>

            <label>Descripción:</label>
            <textarea rows="4" readonly>{{ articulo[2] }}</textarea>

            <label>Precio:</label>
            <input type="text" value="{{ articulo[3] }}" readonly>

            <label>Stock / Cantidad:</label>
            <input type="text" value="{{ articulo[4] }}" readonly>

            <div class="botones">
                <button type="submit" class="eliminar">Confirmar eliminación</button>
                <a href="/" class="cancelar">Cancelar</a>
            </div>

        </form>

    </div>

</body>
</html>
