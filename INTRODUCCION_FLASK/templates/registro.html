<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta tarjeta-registro">
            <h1>Crear cuenta</h1>
            <p class="subtitulo">Completa los siguientes datos.</p>

            {% with mensajes = get_flashed_messages(with_categories=true) %}
                {% if mensajes %}
                    {% for categoria, mensaje in mensajes %}
                        <div class="mensaje {{ categoria }}">{{ mensaje }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('registro') }}" method="POST">
                <label for="nombre">Nombre(s)</label>
                <input type="text" id="nombre" name="nombre" required maxlength="100">

                <label for="apellido_p">Apellido paterno</label>
                <input type="text" id="apellido_p" name="apellido_p" required maxlength="100">

                <label for="apellido_m">Apellido materno</label>
                <input type="text" id="apellido_m" name="apellido_m" required maxlength="100">

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required maxlength="255" autocomplete="email">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">

                <label for="id_rol">Tipo de usuario</label>
                <select name="id_rol" id="id_rol" required>
                    <option value="2">Usuario X</option>
                    <option value="1">Administrador</option>
                </select>

                <button type="submit">Registrarse</button>
            </form>
            <p class="pie-formulario"><a href="{{ url_for('home') }}">Regresar al inicio de sesión</a></p>
        </section>
    </main>
</body>
</html>
