<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>+
    <main class="contenedor">
        <section class="tarjeta">
            <h1>Iniciar sesión</h1>
            <p class="subtitulo">Ingresa tus datos para continuar.</p>
                        <div class="mensaje {{ categoria }}">{{ mensaje }}</div>
            <form action="{{ url_for('login') }}" method="POST">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required autocomplete="email">

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">

                <button type="submit">Entrar</button>
            </form>

            <p class="pie-formulario">¿No tienes cuenta?</p>
            <a href="{{ url_for('registro') }}">Regístrate aquí</a>
            

        </section>
    </main>
</body>
</html>
